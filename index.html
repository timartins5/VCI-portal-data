<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Open+Sans+Condensed:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { --vci-red: #AD2542; --vci-blue: #1B324A; --vci-gray: #F5F5F5; }
    * { font-family: 'Open Sans', sans-serif !important; box-sizing: border-box; }
    
    body { margin: 0; padding: 0; background-color: var(--vci-gray); color: #333; overflow-x: hidden; }
    .header-area { background: #fff; padding: 10px 20px; border-bottom: 1px solid #ddd; }
    h2 { color: var(--vci-blue); font-weight: 700; text-transform: uppercase; margin: 0; font-size: 22px; }
    
    /* TAB STYLING */
    .tabs { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .tab-btn { padding: 6px 12px; cursor: pointer; background: #eee; border: none; font-weight: 700; text-transform: uppercase; font-size: 10px; }
    .tab-btn.active { background: var(--vci-blue); color: #fff; }
    
    .content-area { padding: 15px; }
    .snapshot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    
    .category-box { background: #fff; border-top: 4px solid var(--vci-red); box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 2px; overflow: hidden; }
    
    /* SECTION HEADER: FIXED 14PX */
    .category-header { padding: 10px 15px; font-weight: 700; text-transform: uppercase; font-size: 14px; color: var(--vci-blue); border-bottom: 1px solid #eee; }
    
    /* THE LOCK: Fixed table layout + Pixel-perfect widths */
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    
    /* RED HEADERS: Use Condensed font to save horizontal space */
    th { 
      background: var(--vci-red); 
      color: #fff; 
      padding: 8px 1px; 
      text-align: center; 
      font-size: 12px; 
      font-family: 'Open Sans Condensed', sans-serif !important; 
      text-transform: uppercase; 
      border: none; 
    }
    
    /* COLUMN WIDTHS: Locked in pixels so they CANNOT squish */
    .col-stage { width: auto; text-align: left !important; padding-left: 12px !important; }
    .col-data { width: 90px; } /* Enough room for "Streamline" header */

    td { padding: 8px 2px; border-bottom: 1px solid #eee; font-size: 11px; text-align: center; line-height: 1.2; }
    td:first-child { 
      text-align: left; 
      padding-left: 12px; 
      font-weight: 700; 
      color: var(--vci-blue); 
      white-space: normal; /* Stage names can wrap if they must */
      word-wrap: break-word;
    }

    .del-table .col-time { width: 65%; }

    /* Breakpoint: If the embed is smaller than 880px, go to single column to prevent total collapse */
    @media (max-width: 880px) { 
      .snapshot-grid { grid-template-columns: 1fr; }
      .col-data { width: 22%; } 
    }
  </style>
</head>
<body>
<div class="header-area">
  <h2>Daily Turn Times</h2>
  <div class="tabs" id="tabBar"></div>
</div>
<div class="content-area"><div id="mainDisplay"></div></div>
<script>
  const DATA_URL = 'https://raw.githubusercontent.com/timartins5/VCI-portal-data/main/data/turn-times.json';
  var currentTab = 'Overview';
  var masterData = null;

  async function fetchData() {
    try {
      const response = await fetch(DATA_URL + '?t=' + new Date().getTime());
      masterData = await response.json();
      render();
    } catch (e) { document.getElementById('mainDisplay').innerText = 'Updating...'; }
  }

  function render() {
    let tabList = ['Overview'];
    let gridGroups = {};
    masterData.values.forEach((r, idx) => {
      if (idx === 0) return;
      let cat = r[0] || "";
      if (!cat || cat.includes('Col A')) return;
      if (tabList.indexOf(cat) === -1) tabList.push(cat);
      if (currentTab === 'Overview' || cat === currentTab) {
        if (!gridGroups[cat]) gridGroups[cat] = [];
        gridGroups[cat].push(r);
      }
    });

    let tBar = document.getElementById('tabBar'); tBar.innerHTML = '';
    tabList.forEach(t => {
      let b = document.createElement('button');
      b.className = 'tab-btn' + (t === currentTab ? ' active' : '');
      b.innerText = t;
      b.onclick = function() { currentTab = t; render(); };
      tBar.appendChild(b);
    });

    let display = document.getElementById('mainDisplay');
    display.innerHTML = '';
    let gridContainer = document.createElement('div');
    gridContainer.className = 'snapshot-grid';
    Object.keys(gridGroups).forEach(key => { gridContainer.appendChild(buildBox(key, gridGroups[key])); });
    display.appendChild(gridContainer);
  }

  function buildBox(title, rows) {
    let box = document.createElement('div');
    box.className = 'category-box';
    let h = `<div class="category-header">${title}</div>`;
    
    if (title.toLowerCase().includes('delegated') && !title.toLowerCase().includes('non')) {
      h += `<table class="del-table"><thead><tr><th class="col-stage">Stage</th><th class="col-time">Turn Time</th></tr></thead><tbody>`;
      rows.forEach(r => { h += `<tr><td class="col-stage">${r[1]}</td><td>${(r[2]||'').replace('|',' ')}</td></tr>`; });
    } else {
      h += `<table><thead><tr><th class="col-stage">Stage</th><th class="col-data">Purchase</th><th class="col-data">Refi</th><th class="col-data">Streamline</th></tr></thead><tbody>`;
      rows.forEach(r => {
        h += `<tr><td class="col-stage">${r[1]}</td><td class="col-data">${(r[2]||'').replace('|',' ')}</td><td class="col-data">${(r[3]||'').replace('|',' ')}</td><td class="col-data">${(r[4]||'').replace('|',' ')}</td></tr>`;
      });
    }
    box.innerHTML = h + '</tbody></table>';
    return box;
  }
  fetchData();
</script>
</body>
</html>
