<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --vci-red: #AD2542; --vci-blue: #1B324A; --vci-gray: #F5F5F5; }
    * { font-family: 'Open Sans', sans-serif !important; }
    
    body { margin: 0; padding: 0; background-color: var(--vci-gray); color: #333; }
    .header-area { background: #fff; padding: 12px 20px; border-bottom: 1px solid #ddd; }
    h2 { color: var(--vci-blue); font-weight: 700; text-transform: uppercase; margin: 0; font-size: 26px; }
    .uw-disclaimer { font-size: 11px; color: #666; font-style: italic; margin-top: 2px; display: block; }
    
    .tabs { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .tab-btn { padding: 6px 12px; cursor: pointer; background: #eee; border: none; font-weight: 700; text-transform: uppercase; font-size: 10px; }
    .tab-btn.active { background: var(--vci-blue); color: #fff; }
    
    .content-area { padding: 15px; }
    .snapshot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
    
    .category-box { background: #fff; border-top: 4px solid var(--vci-red); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    /* FIXED: Increased Category Header padding for better spacing */
    .category-header { padding: 12px 15px; font-weight: 700; text-transform: uppercase; font-size: 15px; color: var(--vci-blue); border-bottom: 1px solid #eee; }
    
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    /* FIXED: Adjusted th padding for vertical breathing room */
    th { background: var(--vci-red); color: #fff; padding: 12px 4px; text-align: center; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
    th:first-child { text-align: left; padding-left: 12px; width: 35%; }
    
    /* FIXED: Increased td padding and line-height to stop the squished look */
    td { padding: 10px 4px; border-bottom: 1px solid #eee; font-size: 11px; text-align: center; line-height: 1.4; word-wrap: break-word; }
    td:first-child { text-align: left; padding-left: 12px; font-weight: 700; color: var(--vci-blue); }

    @media (max-width: 650px) { .snapshot-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="header-area">
  <h2>Daily Turn Times</h2>
  <span class="uw-disclaimer" id="disclaimer"></span>
  <div class="tabs" id="tabBar"></div>
</div>
<div class="content-area"><div id="mainDisplay"></div></div>
<script>
  const DATA_URL = 'https://raw.githubusercontent.com/timartins5/VCI-portal-data/main/data/turn-times.json';
  var currentTab = 'Overview';
  var masterData = null;

  async function fetchData() {
    try {
      const response = await fetch(DATA_URL + '?t=' + new Date().getTime());
      masterData = await response.json();
      render();
    } catch (e) { document.getElementById('mainDisplay').innerText = 'System synchronization in progress...'; }
  }

  function render() {
    document.getElementById('disclaimer').innerText = masterData.config['UW_Disclaimer'] || '';
    let tabList = ['Overview'];
    let gridGroups = {};
    masterData.values.forEach((r, idx) => {
      if (idx === 0) return;
      let cat = r[0] || "";
      if (!cat || cat.includes('Col A')) return;
      if (tabList.indexOf(cat) === -1) tabList.push(cat);
      if (currentTab === 'Overview' || cat === currentTab) {
        if (!gridGroups[cat]) gridGroups[cat] = [];
        gridGroups[cat].push(r);
      }
    });

    let tBar = document.getElementById('tabBar'); tBar.innerHTML = '';
    tabList.forEach(t => {
      let b = document.createElement('button');
      b.className = 'tab-btn' + (t === currentTab ? ' active' : '');
      b.innerText = t;
      b.onclick = function() { currentTab = t; render(); };
      tBar.appendChild(b);
    });

    let display = document.getElementById('mainDisplay');
    display.innerHTML = '';
    let gridContainer = document.createElement('div');
    gridContainer.className = 'snapshot-grid';
    Object.keys(gridGroups).forEach(key => { gridContainer.appendChild(buildBox(key, gridGroups[key])); });
    display.appendChild(gridContainer);
  }

  function buildBox(title, rows) {
    let box = document.createElement('div');
    box.className = 'category-box';
    let h = `<div class="category-header">${title}</div>`;
    h += '<table><thead><tr><th>Stage</th><th>Purchase</th><th>Refi</th><th>Streamline</th></tr></thead><tbody>';
    rows.forEach(r => { h += `<tr><td>${r[1]}</td><td>${(r[2]||'').replace('|',' ')}</td><td>${(r[3]||'').replace('|',' ')}</td><td>${(r[4]||'').replace('|',' ')}</td></tr>`; });
    box.innerHTML = h + '</tbody></table>';
    return box;
  }
  fetchData();
</script>
</body>
</html>
