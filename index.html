<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --vci-red: #AD2542; --vci-blue: #1B324A; --vci-gray: #F5F5F5; }
    body { font-family: 'Open Sans', sans-serif; margin: 0; padding: 0; background-color: var(--vci-gray); color: #333; }
    .header-area { background: #fff; padding: 20px 40px; border-bottom: 1px solid #ddd; }
    h2 { color: var(--vci-blue); font-weight: 700; text-transform: uppercase; margin: 0; font-size: 32px; }
    .uw-disclaimer { font-size: 13px; color: #666; font-style: italic; margin-top: 5px; display: block; }
    .tabs { display: flex; gap: 10px; margin-top: 20px; }
    .tab-btn { padding: 8px 15px; cursor: pointer; background: #eee; border: none; font-weight: 700; text-transform: uppercase; font-size: 11px; }
    .tab-btn.active { background: var(--vci-blue); color: #fff; }
    .content-area { padding: 30px 40px; display: flex; gap: 30px; align-items: flex-start; }
    .table-section { flex: 3; }
    .snapshot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
    .category-box { background: #fff; border-top: 5px solid var(--vci-red); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .category-header { padding: 12px 15px; font-weight: 700; text-transform: uppercase; font-size: 15px; color: var(--vci-blue); border-bottom: 1px solid #eee; }
    table { width: 100%; border-collapse: collapse; }
    th { background: var(--vci-red); color: #fff; padding: 8px 15px; text-align: left; font-size: 11px; text-transform: uppercase; }
    td { padding: 10px 15px; border-bottom: 1px solid #eee; font-size: 13px; }
    .sidebar { flex: 1; min-width: 280px; background: #fff; padding: 25px; border-top: 5px solid var(--vci-red); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .sidebar h3 { color: var(--vci-blue); font-size: 16px; text-transform: uppercase; margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    .note-block { margin-bottom: 15px; }
    .note-label { display: block; font-weight: 700; color: var(--vci-blue); font-size: 10px; text-transform: uppercase; margin-bottom: 3px; }
    .note-text { font-family: 'Times New Roman', serif; font-size: 14px; line-height: 1.4; color: #444; white-space: pre-line; }
  </style>
</head>
<body>
<div class="header-area">
  <h2>Daily Turn Times</h2>
  <span class="uw-disclaimer" id="disclaimer"></span>
  <div class="tabs" id="tabBar"></div>
</div>
<div class="content-area">
  <div class="table-section" id="mainDisplay">Loading latest data...</div>
  <div class="sidebar" id="notesArea"></div>
</div>
<script>
  const DATA_URL = 'https://raw.githubusercontent.com/timartins5/VCI-portal-data/main/data/turn-times.json';
  let currentTab = 'Overview';
  let masterData = null;

  async function fetchData() {
    try {
      const response = await fetch(DATA_URL);
      masterData = await response.json();
      render();
    } catch (e) {
      document.getElementById('mainDisplay').innerText = 'System maintenance in progress.';
    }
  }

  function render() {
    // 1. Scrub weird symbols from the disclaimer at the top
    document.getElementById('disclaimer').innerText = (masterData.config['UW_Disclaimer'] || '').replace(/[^\x20-\x7E]/g, '');
    
    // 2. Render Sidebar Notes with aggressive scrubbing for hidden characters
    let n = '<h3>Notes & Definitions</h3>';
    ['UW_Assignment_Note', 'Advanced_UW_Criteria', 'Lock_Desk_Detail', 'Non_Del_Review'].forEach(k => {
      let rawText = masterData.config[k] || 'N/A';
      
      // Specifically targets the hidden Unicode characters causing the "?" symbols
      let cleanText = rawText.replace(/[\u00A0\u1680\u180E\u2000-\u200B\u202F\u205F\u3000\uFEFF]/g, ' ') 
                             .replace(/[^\x20-\x7E\n]/g, '• '); 
      
      n += `<div class="note-block"><span class="note-label">${k.replace(/_/g,' ')}</span>`;
      n += `<div class="note-text">${cleanText}</div></div>`;
    });
    document.getElementById('notesArea').innerHTML = n;

    // 3. Build the Tab Navigation
    let tabList = ['Overview'];
    for(let i=1; i<masterData.values.length; i++) {
      let c = masterData.values[i][0];
      if(c && !tabList.includes(c)) tabList.push(c);
    }
    
    let tBar = document.getElementById('tabBar'); 
    tBar.innerHTML = '';
    tabList.forEach(t => {
      let b = document.createElement('button');
      b.className = 'tab-btn' + (t === currentTab ? ' active' : '');
      b.innerText = t;
      b.onclick = () => { currentTab = t; render(); };
      tBar.appendChild(b);
    });

    // 4. Group Data by Category
    let groups = {};
    for(let i=1; i<masterData.values.length; i++) {
      let cat = masterData.values[i][0];
      if(currentTab !== 'Overview' && cat !== currentTab) continue;
      if(!groups[cat]) groups[cat] = [];
      groups[cat].push(masterData.values[i]);
    }

    // 5. Render Tables (Snapshot Grid for Overview, Single for Tabs)
    let display = document.getElementById('mainDisplay');
    display.innerHTML = '';
    let catKeys = Object.keys(groups);

    if(currentTab === 'Overview') {
      // Creates the side-by-side layout (2 columns)
      for(let k=0; k<catKeys.length; k+=2) {
        let grid = document.createElement('div');
        grid.className = 'snapshot-grid';
        grid.appendChild(buildBox(catKeys[k], groups[catKeys[k]]));
        if(catKeys[k+1]) grid.appendChild(buildBox(catKeys[k+1], groups[catKeys[k+1]]));
        display.appendChild(grid);
      }
    } else {
      // Single full-width table for specific tabs
      display.appendChild(buildBox(currentTab, groups[currentTab]));
    }
  }

  function buildBox(title, rows) {
    let box = document.createElement('div');
    box.className = 'category-box';
    let h = `<div class="category-header">${title}</div>`;
    h += '<table><thead><tr><th>Milestone</th><th>Purchase</th><th>Refi</th></tr></thead><tbody>';
    rows.forEach(r => {
      h += `<tr><td>${r[1]}</td><td>${r[2].replace('|',' ')}</td><td>${r[3].replace('|',' ')}</td></tr>`;
    });
    box.innerHTML = h + '</tbody></table>';
    return box;
  }
  fetchData();
</script>
</body>
</html>
