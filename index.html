<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --vci-red: #AD2542; --vci-blue: #1B324A; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Open Sans', system-ui, sans-serif; }
    body { background: #F4F4F4; color: #333; overflow-x: hidden; }

    .header { background: #fff; padding: 14px 20px 0; border-bottom: 2px solid #e0e0e0; }
    .header h2 { color: var(--vci-blue); font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }

    .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
    .tab { padding: 7px 14px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; border: none; cursor: pointer; background: transparent; color: #666; border-bottom: 3px solid transparent; transition: all 0.15s; }
    .tab:hover { color: var(--vci-blue); }
    .tab.active { color: var(--vci-blue); border-bottom-color: var(--vci-red); }

    .content { padding: 16px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }

    .box { background: #fff; border-radius: 3px; overflow: hidden; border: 1px solid #e4e4e4; border-top: 3px solid var(--vci-red); }
    .box-header { padding: 10px 14px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; color: var(--vci-blue); background: #fafafa; border-bottom: 1px solid #eee; }

    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    thead tr { background: var(--vci-red); }
    th { color: #fff; padding: 7px 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; text-align: center; }
    th:first-child { text-align: left; padding-left: 14px; }
    td { padding: 7px 8px; border-bottom: 1px solid #f0f0f0; font-size: 9px; text-align: center; color: #444; }
    td:first-child { text-align: left; padding-left: 14px; font-weight: 700; color: var(--vci-blue); font-size: 9px; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fdf5f7; }

    .col-stage { width: 35%; }
    .col-val { width: 21.66%; }
    .col-val-wide { width: 65%; }

    @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="header">
  <h2>Daily Turn Times</h2>
  <div class="tabs" id="tabBar"></div>
</div>
<div class="content">
  <div class="grid" id="mainDisplay"></div>
</div>

<script>
  const DATA_URL = 'https://raw.githubusercontent.com/timartins5/VCI-portal-data/main/data/turn-times.json';
  let currentTab = 'Overview';
  let masterData = null;

  async function fetchData() {
    try {
      const response = await fetch(DATA_URL + '?t=' + Date.now());
      masterData = await response.json();
      render();
    } catch (e) {
      document.getElementById('mainDisplay').innerHTML = '<p style="color:#888;padding:20px">Syncing data…</p>';
    }
  }

  function render() {
    const tabList = ['Overview'];
    const groups = {};

    masterData.values.forEach((r, i) => {
      if (i === 0) return;
      const cat = (r[0] || '').trim();
      if (!cat || cat.includes('Col A')) return;
      if (!tabList.includes(cat)) tabList.push(cat);
      if (currentTab === 'Overview' || cat === currentTab) {
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(r);
      }
    });

    const bar = document.getElementById('tabBar');
    bar.innerHTML = '';
    tabList.forEach(t => {
      const b = document.createElement('button');
      b.className = 'tab' + (t === currentTab ? ' active' : '');
      b.textContent = t;
      b.onclick = () => { currentTab = t; render(); };
      bar.appendChild(b);
    });

    const display = document.getElementById('mainDisplay');
    display.innerHTML = '';
    Object.keys(groups).forEach(k => display.appendChild(buildBox(k, groups[k])));
  }

  function buildBox(title, rows) {
    const box = document.createElement('div');
    box.className = 'box';
    const isDel = title.toLowerCase().includes('delegated') && !title.toLowerCase().includes('non');

    let html = `<div class="box-header">${title}</div><table>`;

    if (isDel) {
      html += `<thead><tr>
        <th class="col-stage">Stage</th>
        <th class="col-val-wide">Turn Time</th>
      </tr></thead><tbody>`;
      rows.forEach(r => {
        html += `<tr>
          <td>${r[1] || ''}</td>
          <td style="text-align:center">${(r[2] || '').replace('|', ' ')}</td>
        </tr>`;
      });
    } else {
      html += `<thead><tr>
        <th class="col-stage">Stage</th>
        <th class="col-val">Purchase</th>
        <th class="col-val">Refi</th>
        <th class="col-val">Streamline</th>
      </tr></thead><tbody>`;
      rows.forEach(r => {
        html += `<tr>
          <td>${r[1] || ''}</td>
          <td>${(r[2] || '').replace('|', ' ')}</td>
          <td>${(r[3] || '').replace('|', ' ')}</td>
          <td>${(r[4] || '').replace('|', ' ')}</td>
        </tr>`;
      });
    }

    box.innerHTML = html + '</tbody></table>';
    return box;
  }

  fetchData();
</script>

</body>
</html>
