<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --vci-red: #AD2542; --vci-blue: #1B324A; --vci-gray: #F5F5F5; }
    body { font-family: 'Open Sans', sans-serif; margin: 0; padding: 0; background-color: var(--vci-gray); color: #333; }
    .header-area { background: #fff; padding: 20px 40px; border-bottom: 1px solid #ddd; }
    h2 { color: var(--vci-blue); font-weight: 700; text-transform: uppercase; margin: 0; font-size: 39px; }
    .uw-disclaimer { font-size: 13px; color: #666; font-style: italic; margin-top: 5px; display: block; }
    .tabs { display: flex; gap: 10px; margin-top: 20px; }
    .tab-btn { padding: 8px 15px; cursor: pointer; background: #eee; border: none; font-weight: 700; text-transform: uppercase; font-size: 11px; }
    .tab-btn.active { background: var(--vci-blue); color: #fff; }
    .content-area { padding: 30px 40px; display: flex; gap: 30px; align-items: flex-start; }
    .table-section { flex: 3; }
    .snapshot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .footer-header { color: var(--vci-blue); font-size: 16px; font-weight: 700; text-transform: uppercase; margin-top: 50px; margin-bottom: 20px; text-align: center; letter-spacing: 1px; position: relative; }
    .footer-header::after { content: ""; display: block; width: 60px; height: 3px; background: var(--vci-red); margin: 8px auto 0; }
    .snapshot-footer { display: flex; gap: 20px; width: 100%; margin-bottom: 40px; }
    .footer-box { background: #fff; flex: 1; padding: 20px 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-radius: 4px; }
    .footer-label { font-size: 10px; text-transform: uppercase; color: #999; display: block; margin-bottom: 8px; font-weight: 700; }
    .footer-val { font-weight: 700; color: var(--vci-blue); font-size: 13px; line-height: 1.4; display: block; }
    
    .category-box { background: #fff; border-top: 5px solid var(--vci-red); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    
    /* UPDATED: Category Header Size */
    .category-header { padding: 15px 20px; font-weight: 700; text-transform: uppercase; font-size: 18px; color: var(--vci-blue); border-bottom: 1px solid #eee; }
    
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    
    /* UPDATED: Table Header Size */
    th { background: var(--vci-red); color: #fff; padding: 10px 8px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    td { padding: 10px 8px; border-bottom: 1px solid #eee; font-size: 12px; word-wrap: break-word; }
    
    th:nth-child(1), td:nth-child(1) { width: 34%; } 
    th:nth-child(2), td:nth-child(2),
    th:nth-child(3), td:nth-child(3),
    th:nth-child(4), td:nth-child(4) { width: 22%; text-align: center; }

    .sidebar { flex: 1; min-width: 280px; background: #fff; padding: 25px; border-top: 5px solid var(--vci-red); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .sidebar h3 { color: var(--vci-blue); font-size: 16px; text-transform: uppercase; margin-top: 0; border-bottom: 1px solid #eee; padding-bottom: 10px; }
    .note-block { margin-bottom: 15px; }
    .note-label { display: block; font-weight: 700; color: var(--vci-blue); font-size: 10px; text-transform: uppercase; margin-bottom: 3px; }
    .note-text { font-family: 'Times New Roman', serif; font-size: 14px; line-height: 1.4; color: #444; white-space: pre-line; }
  </style>
</head>
<body>
<div class="header-area">
  <h2>Daily Turn Times</h2>
  <span class="uw-disclaimer" id="disclaimer"></span>
  <div class="tabs" id="tabBar"></div>
</div>
<div class="content-area">
  <div class="table-section">
    <div id="mainDisplay">Loading latest data...</div>
    <div id="footerHeader" class="footer-header">Lock Desk Hours</div>
    <div id="footerDisplay" class="snapshot-footer"></div>
  </div>
  <div class="sidebar" id="notesArea"></div>
</div>
<script>
  const DATA_URL = 'https://raw.githubusercontent.com/timartins5/VCI-portal-data/main/data/turn-times.json';
  let currentTab = 'Overview';
  let masterData = null;

  async function fetchData() {
    try {
      const response = await fetch(DATA_URL + '?t=' + new Date().getTime());
      masterData = await response.json();
      render();
    } catch (e) { document.getElementById('mainDisplay').innerText = 'System maintenance in progress.'; }
  }

  function render() {
    document.getElementById('disclaimer').innerText = (masterData.config['UW_Disclaimer'] || '').replace(/[^\x20-\x7E\n]/g, '');
    let n = '<h3>Notes & Definitions</h3>';
    ['UW_Assignment_Note', 'Advanced_UW_Criteria', 'Lock_Desk_Detail', 'Non_Del_Review'].forEach(k => {
      let cleanText = (masterData.config[k] || 'N/A').replace(/[^\x20-\x7E\n]/g, ' '); 
      n += `<div class="note-block"><span class="note-label">${k.replace(/_/g,' ')}</span><div class="note-text">${cleanText}</div></div>`;
    });
    document.getElementById('notesArea').innerHTML = n;

    let tabList = ['Overview'];
    let gridGroups = {};
    masterData.values.forEach(r => {
      let cat = r[0] || "";
      if (cat.includes('Col A') || !cat) return;
      if (!tabList.indexOf(cat)) tabList.push(cat);
      if (currentTab === 'Overview' || cat === currentTab) {
        if (!gridGroups[cat]) gridGroups[cat] = [];
        gridGroups[cat].push(r);
      }
    });

    let tBar = document.getElementById('tabBar'); tBar.innerHTML = '';
    tabList.forEach(t => {
      let b = document.createElement('button');
      b.className = 'tab-btn' + (t === currentTab ? ' active' : '');
      b.innerText = t;
      b.onclick = function() { currentTab = t; render(); };
      tBar.appendChild(b);
    });

    let display = document.getElementById('mainDisplay');
    display.innerHTML = '';
    let catKeys = Object.keys(gridGroups);

    if(currentTab === 'Overview') {
      for(let k=0; k<catKeys.length; k+=2) {
        let grid = document.createElement('div');
        grid.className = 'snapshot-grid';
        grid.appendChild(buildBox(catKeys[k], gridGroups[catKeys[k]]));
        if(catKeys[k+1]) grid.appendChild(buildBox(catKeys[k+1], gridGroups[catKeys[k+1]]));
        display.appendChild(grid);
      }
    } else {
      display.appendChild(buildBox(currentTab, gridGroups[currentTab]));
    }

    let fDisplay = document.getElementById('footerDisplay');
    fDisplay.innerHTML = '';
    const bannerConfig = [
      { label: 'Monday - Friday', key: 'LockDesk_Hours' },
      { label: 'Jumbo (Mon - Fri)', key: 'Jumbo_Hours' },
      { label: 'Weekend', key: 'Weekend_Locks' }
    ];
    bannerConfig.forEach(item => {
      let box = document.createElement('div');
      box.className = 'footer-box';
      let timeValue = (masterData.config[item.key] || 'Hours Not Set').replace(/[^\x20-\x7E\n]/g, '-');
      box.innerHTML = `<span class="footer-label">${item.label}</span><span class="footer-val">${timeValue}</span>`;
      fDisplay.appendChild(box);
    });
  }

  function buildBox(title, rows) {
    let box = document.createElement('div');
    box.className = 'category-box';
    let h = `<div class="category-header">${title}</div>`;
    h += '<table><thead><tr><th>Stage</th><th>Purchase</th><th>Refi</th><th>Streamline</th></tr></thead><tbody>';
    rows.forEach(r => {
      h += `<tr><td>${r[1]}</td><td>${(r[2]||'').replace('|',' ')}</td><td>${(r[3]||'').replace('|',' ')}</td><td>${(r[4]||'').replace('|',' ')}</td></tr>`;
    });
    box.innerHTML = h + '</tbody></table>';
    return box;
  }
  fetchData();
</script>
</body>
</html>
